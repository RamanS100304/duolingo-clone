# Alternative to Railway: Render Blueprint (New -> Blueprint). A persistent disk needs a paid
# instance type on Render; free instances lose the SQLite file on every restart.
services:
  - type: web
    name: duolingo-clone-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/duolingo.db
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
